<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel Socials TV</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#071a30">
<link rel="icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../style.css?v=15">
</head>
<body class="tv">
<div class="tvbar">
  <div class="tvbar-l"><img src="../logo-p.png?v=15" alt="" onerror="this.hidden=true"></div>
  <div class="tvbar-c" id="bartitle"></div>
  <div class="tvbar-r"><img src="../conquer-wordmark-white.png?v=15" alt="Conquer Padel Club"></div>
</div>
<div id="tv"></div>
<button id="fs" class="fsbtn" type="button" autofocus>Full screen</button>
<div id="date" class="tvdate"><span id="daytext"></span><span id="timetext" class="num"></span><span id="status" class="tvstatus"></span></div>
<div id="tvcode" class="tvcode"></div>
<script src="../config.js?v=15"></script>
<script src="../engine.js?v=15"></script>
<script src="../store.js?v=15"></script>
<script src="../awake.js?v=15"></script>
<script src="../qr.js?v=15"></script>
<script src="../tv.js?v=15"></script>
</body>
</html>
